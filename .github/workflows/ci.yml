name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/mytracker_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build client
        run: npm run build

      # Ссылки на строки в docs/ должны совпадать с кодом. Если код поменяли, а docs:build не запустили, CI упадёт.
      - name: Docs references
        run: npm run docs:check
