# Защитные заголовки. Подключается из deploy/nginx.conf, один файл на все серверные блоки.
# frame-ancestors пускает во фрейм только сам сайт и Telegram (Mini App в Telegram Web).
# script-src: единственный внешний скрипт — telegram-web-app.js.
# Не добавляйте add_header внутрь location: он сбросит заголовки, унаследованные отсюда.

server_tokens off;

add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://telegram.org https://*.telegram.org" always;
