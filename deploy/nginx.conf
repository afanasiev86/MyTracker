# Шаблон nginx: раздаёт собранный клиент и проксирует API.
# Замените tracker.example.com на свой домен. HTTPS: sudo certbot --nginx -d tracker.example.com

server {
    listen 80;
    server_name tracker.example.com;

    root /srv/mytracker/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Заменяем заголовок клиента, а не дополняем: иначе адрес можно подделать и обойти лимит попыток входа
        proxy_set_header X-Forwarded-For $remote_addr;
        # Вложения до 5 МБ (MAX_ATTACHMENT_BYTES), с запасом
        client_max_body_size 6m;
    }

    location / {
        try_files $uri /index.html;
    }
}
